name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cff3efc7cbe0c9627b82dc3e846c89fd772a39a6 # v1.21.1
        with:
          node-version: "24.21.0"
          version: "1.0.0"
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test --config vitest.config.ts
      - run: vp build
      - run: vp run test:lifecycle
      - run: vp exec wrangler types --check
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Check documentation and configuration formatting
        run: >-
          npx --yes prettier@3.9.9 --check
          README.md AGENTS.md
          "docs/**/*.md" ".github/**/*.md" ".github/**/*.yml"
          skills-lock.json .prettierrc.json
